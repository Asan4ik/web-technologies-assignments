<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - KazTour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">KazTour</a>
            <button class="theme-toggle btn btn-outline-light order-1 ms-auto me-2" type="button" aria-pressed="false"
                aria-label="Switch to night mode" title="Switch to night mode">
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
            <a class="auth-nav-link btn btn-outline-light order-2" href="login.html">Log in</a>
            <button class="navbar-toggler order-3 ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse order-4 order-lg-0" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="trip-guide.html">Trip Guide</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-offset container flex-grow-1">
        <div class="account-card mx-auto">
            <div class="card shadow-sm" id="profileCard" hidden>
                <div class="card-body p-4">
                    <h1 class="h3 mb-4">Your profile</h1>
                    <dl class="row mb-4">
                        <dt class="col-sm-4 fw-normal text-secondary">Name</dt>
                        <dd class="col-sm-8" data-profile-field="name"></dd>
                        <dt class="col-sm-4 fw-normal text-secondary">Email</dt>
                        <dd class="col-sm-8 text-break" data-profile-field="email"></dd>
                        <dt class="col-sm-4 fw-normal text-secondary">Phone</dt>
                        <dd class="col-sm-8" data-profile-field="phone"></dd>
                        <dt class="col-sm-4 fw-normal text-secondary">Member since</dt>
                        <dd class="col-sm-8 mb-0" data-profile-field="joined"></dd>
                    </dl>
                    <button type="button" class="btn btn-primary" id="logoutButton">Log out</button>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-custom">
        <div class="container-fluid px-5">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-white">KazTour</h5>
                <ul class="nav">
                    <li class="nav-item px-4 text-white">Group members: Asanali Serik, Sanzhar Zhussip SE-2515</li>
                    <li class="nav-item px-4 text-white">Team name: Straw Hats</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"

    <script src="js/script.js"></script>

</html>
