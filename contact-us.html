<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="assets/extend.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top" style="background-color: #12182d;">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">KazTour</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation"
                style="border: 2px solid white;">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="trip-guide.html">Trip Guide</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact-us.html">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="carousel-inner">
        <div class="carousel-item active hero-section position-relative">

            <img src="assets/images/kolsay.webp" class="w-100 h-100 object-fit-cover">

            <div class="overlay"></div>

            <div class="position-absolute top-50 start-50 translate-middle text-center text-white">
                <h1>Plan Your Trip</h1>
                <p>Have questions about planning your trip to Kazakhstan? Get in touch with our team!</p>
            </div>

        </div>
    </div>

    <div class="mx-auto mt-5 px-3 border rounded form-container" style="width: clamp(500px, 60%, 800px);">
        <h4 class="my-3">Send us message</h4>
        <div class="mb-3">
            <label for="exampleFormControlInput1" class="form-label">Name</label>
            <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="John Doe">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlInput2" class="form-label">Email address</label>
            <input type="email" class="form-control" id="exampleFormControlInput2" placeholder="name@example.com">
        </div>
        <div class="mb-3">
            <label for="exampleFormControlSelect1" class="form-label">Destination</label>
            <select class="form-select" id="exampleFormControlSelect1" aria-label="Default select example">
                <option selected>Open this select menu</option>
                <option value="1">Almaty</option>
                <option value="2">Astana</option>
                <option value="3">Burabay</option>
                <option value="4">Other</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="exampleFormControlCheck1" class="form-label">Trip Type:</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault1">
                <label class="form-check-label" for="radioDefault1">
                    Nature and Adventure
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault2" checked>
                <label class="form-check-label" for="radioDefault2">
                    Cultural and Historical
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault3">
                <label class="form-check-label" for="radioDefault3">
                    City Break
                </label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="radioDefault" id="radioDefault4">
                <label class="form-check-label" for="radioDefault4">
                    Other
                </label>
            </div>
        </div>
        <div class="mb-3">
            <label for="exampleFormControlTextarea1" class="form-label">Message</label>
            <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
        </div>
        <button type="button" class="btn btn-primary mb-3">Submit</button>
    </div>


    <footer class="footer-custom" style="background-color: #12182d;
            padding: 30px 0;
            margin-top: 50px;">
        <div class="container-fluid px-5">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0 text-white">
                    KazTour
                </h5>

                <ul class="nav">
                    <li class="nav-item">
                        <a href="index.html" class="nav-link px-2 text-white">Home</a>
                    </li>

                    <li class="nav-item">
                        <a href="destinations.html" class="nav-link px-2 text-white">Destinations</a>
                    </li>

                    <li class="nav-item">
                        <a href="trip-guide.html" class="nav-link px-2 text-white">Trip Guides</a>
                    </li>

                    <li class="nav-item">
                        <a href="contact-us.html" class="nav-link px-2 text-white">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </footer>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
