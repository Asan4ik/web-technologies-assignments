<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - KazTour</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="css/style.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg fixed-top" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">KazTour</a>
            <button class="theme-toggle btn btn-outline-light order-1 ms-auto me-2" type="button" aria-pressed="false"
                aria-label="Switch to night mode" title="Switch to night mode">
                <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
                </svg>
                <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5" />
                    <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
            </button>
            <a class="auth-nav-link btn btn-outline-light order-2" href="login.html">Log in</a>
            <button class="navbar-toggler order-3 ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse order-4 order-lg-0" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="destinations.html">Destinations</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="trip-guide.html">Trip Guide</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contact.html">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="page-offset container flex-grow-1">
        <div class="account-card mx-auto">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <ul class="nav nav-tabs mb-4" id="authTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="login-tab" type="button" role="tab"
                                data-bs-toggle="tab" data-bs-target="#login-pane" aria-controls="login-pane"
                                aria-selected="true">Log in</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="signup-tab" type="button" role="tab"
                                data-bs-toggle="tab" data-bs-target="#signup-pane" aria-controls="signup-pane"
                                aria-selected="false">Sign up</button>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="login-pane" role="tabpanel"
                            aria-labelledby="login-tab" tabindex="0">
                            <div id="loginStatus" class="alert d-none" role="alert"></div>
                            <form id="loginForm" novalidate>
                                <div class="mb-3">
                                    <label for="loginEmail" class="form-label">Email address</label>
                                    <input type="text" inputmode="email" autocomplete="email" class="form-control"
                                        id="loginEmail" placeholder="name@example.com">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-4">
                                    <label for="loginPassword" class="form-label">Password</label>
                                    <input type="password" autocomplete="current-password" class="form-control"
                                        id="loginPassword">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Log in</button>
                            </form>
                        </div>

                        <div class="tab-pane fade" id="signup-pane" role="tabpanel" aria-labelledby="signup-tab"
                            tabindex="0">
                            <form id="signupForm" novalidate>
                                <div class="mb-3">
                                    <label for="signupName" class="form-label">Full name</label>
                                    <input type="text" autocomplete="name" class="form-control" id="signupName"
                                        placeholder="John Doe">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="signupEmail" class="form-label">Email address</label>
                                    <input type="text" inputmode="email" autocomplete="email" class="form-control"
                                        id="signupEmail" placeholder="name@example.com">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="signupPhone" class="form-label">Phone number</label>
                                    <input type="tel" autocomplete="tel" class="form-control" id="signupPhone"
                                        placeholder="+7 701 123 45 67">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <div class="mb-3">
                                    <label for="signupPassword" class="form-label">Password</label>
                                    <input type="password" autocomplete="new-password" class="form-control"
                                        id="signupPassword" aria-describedby="signupPasswordHint">
                                    <div class="invalid-feedback"></div>
                                    <div id="signupPasswordHint" class="form-text">
                                        8 to 32 characters with an uppercase letter, a number and a special character.
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="signupConfirm" class="form-label">Repeat password</label>
                                    <input type="password" autocomplete="new-password" class="form-control"
                                        id="signupConfirm">
                                    <div class="invalid-feedback"></div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Create account</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-custom">
        <div class="container-fluid px-5">
            <div class="d-flex justify-content-between align-items-center">
                <h5 class="mb-0 text-white">KazTour</h5>
                <ul class="nav">
                    <li class="nav-item px-4 text-white">Group members: Asanali Serik, Sanzhar Zhussip SE-2515</li>
                    <li class="nav-item px-4 text-white">Team name: Straw Hats</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="js/script.js"></script>
</body>

</html>
